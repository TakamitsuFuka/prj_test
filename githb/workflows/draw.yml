
name: Generate and Publish Flowchart

on:
  push:
    branches:
      - main
    paths:
      - "data.json"
      - "0_plot_diagram.py"
      - "requirements.txt"
      - ".github/workflows/draw.yml"

  workflow_dispatch:

# GitHub Pagesへの公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数の公開処理を行わない
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Graphviz and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Install Python packages
        run: |
          pip install -r requirements.txt

      - name: Generate HTML and SVG
        run: |
          python 0_plot_diagram.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
